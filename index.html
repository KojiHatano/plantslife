<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7aab5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlantsLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('pl-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<title>PlantsLife</title>
</head>
<body>
<div class="app">
  <div class="top"><span class="sp"></span><div class="logo">Plants<b>Life</b></div><button class="ic" data-act="tab" data-t="data" aria-label="データ">⚙</button></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" data-act="add-plant" aria-label="植物を追加">＋</button>
<nav id="nav">
  <button data-act="tab" data-t="home"><span class="g">⌂</span>ホーム</button>
  <button data-act="tab" data-t="list"><span class="g">❦</span>植物一覧</button>
  <button data-act="tab" data-t="hist"><span class="g">▦</span>履歴</button>
</nav>
<div id="detail"></div>
<div id="crop"></div>
<div class="mask" id="mask" data-act="close-sheet"></div>
<div class="sheetp" id="sheet"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="import" accept="application/json,.json" hidden>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
